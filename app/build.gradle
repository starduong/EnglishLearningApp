plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'   // ✅ Plugin Firebase
}

android {
    namespace 'com.example.englishlearningapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.englishlearningapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    /* ----------------------------- UI Components ----------------------------- */
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.cardview
    implementation libs.recyclerview
    implementation libs.swiperefreshlayout
    implementation libs.flexbox
    implementation libs.circleimageview   // Avatar tròn

    /* ------------------------------- AndroidX ------------------------------- */
    implementation libs.activity
    implementation libs.core
    implementation libs.core.ktx
    implementation libs.annotation

    /* --------------------------- Architecture (MVVM) ------------------------- */
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx

    /* ----------------------------- Firebase SDK ----------------------------- */
    implementation platform(libs.firebase.bom) // Firebase BoM: phải đặt trước

    // Firebase cơ bản
    implementation libs.firebase.analytics
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.database
    implementation libs.firebase.messaging

    // Google Sign-In
    implementation libs.play.services.auth

    /* ------------------------------- Networking ------------------------------ */
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.converter.simplexml
    implementation libs.retrofit.converter
    implementation libs.logging.interceptor
    implementation libs.okhttp

    /* ----------------------------- JSON & Image ----------------------------- */
    implementation libs.gson
    implementation libs.glide
    annotationProcessor libs.compiler    // Glide compiler

    /* -------------------------- Machine Learning ----------------------------- */
    implementation libs.translate
    implementation libs.play.services.mlkit.text.recognition

    /* -------------------------- Crypto & Security ---------------------------- */
    implementation libs.bcrypt

    /* ------------------------------ Media / Video ---------------------------- */
    implementation libs.androidyoutubeplayer.core  // YouTube Player (thay thế API cũ)

    /* -------------------------------- Testing ------------------------------- */
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}